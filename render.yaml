services:
  - type: web
    name: mybhoomi-backend-prod
    runtime: docker
    dockerfilePath: ./BhulekBackend/Dockerfile
    dockerContext: ./BhulekBackend
    plan: starter
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: APPLE_BUNDLE_ID
        value: com.kirtidhwaj.Bhumitra
      - key: APPLE_ENVIRONMENT
        value: Production
      - key: BHULEKH_MAX_CONCURRENT
        value: "3"
      - key: MAX_PENDING_BHULEKH_REQUESTS
        value: "10"
      - key: ROR_TIMEOUT_SECONDS
        value: "90"
      - key: PDF_TIMEOUT_SECONDS
        value: "60"
      - key: GIS_TIMEOUT_SECONDS
        value: "15"
      - key: BHULEKH_NAVIGATION_TIMEOUT_MS
        value: "20000"
      - key: BHULEKH_ACTION_TIMEOUT_MS
        value: "10000"
